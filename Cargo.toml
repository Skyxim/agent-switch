[package]
name = "agent-switch"
version = "1.0.0"
edition = "2021"
description = "Fast, encrypted CLI switcher for AI agent credentials (Codex & Antigravity)"
license = "MIT"
readme = "AGENTS.md"

[[bin]]
name = "ags"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
dirs = "5.0"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.40", features = ["full"] }
aes-gcm = "0.10"
futures-util = "0.3"
tempfile = "3.12"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
