name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-26
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-26-intel
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Install musl-tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build and package release asset
        shell: bash
        env:
          USE_CROSS: ${{ matrix.use_cross }}
        run: just package release ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Load Secrets from Proton Pass
        if: ${{ secrets.PROTON_PASS_PAT != '' }}
        uses: protonpass/load-secret-action@v1.1.0
        with:
          personal-access-token: ${{ secrets.PROTON_PASS_PAT }}
          export-env: true
        env:
          HOMEBREW_TAP_TOKEN: "pass://Env/ci/HOMEBREW_TAP_TOKEN"

      - name: Update Homebrew Tap Formula
        if: env.HOMEBREW_TAP_TOKEN != '' || secrets.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"

          # Extract SHA256 checksums from built release assets
          SHA_MAC_ARM=$(awk '{print $1}' release-assets/ags-${VERSION}-aarch64-apple-darwin.tar.gz.sha256)
          SHA_MAC_INTEL=$(awk '{print $1}' release-assets/ags-${VERSION}-x86_64-apple-darwin.tar.gz.sha256)
          SHA_LINUX_MUSL_ARM=$(awk '{print $1}' release-assets/ags-${VERSION}-aarch64-unknown-linux-musl.tar.gz.sha256)
          SHA_LINUX_MUSL_INTEL=$(awk '{print $1}' release-assets/ags-${VERSION}-x86_64-unknown-linux-musl.tar.gz.sha256)

          # Clone Tap repository
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Skyxim/homebrew-agent-switch.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          # Render Formula/agent-switch.rb
          cat <<EOF | sed 's/^[[:space:]]\{10\}//' > Formula/agent-switch.rb
          class AgentSwitch < Formula
            desc "Fast, encrypted CLI switcher for AI agent credentials (Codex & Antigravity)"
            homepage "https://github.com/Skyxim/agent-switch"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/Skyxim/agent-switch/releases/download/v#{version}/ags-#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              end
              on_intel do
                url "https://github.com/Skyxim/agent-switch/releases/download/v#{version}/ags-#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_INTEL}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/Skyxim/agent-switch/releases/download/v#{version}/ags-#{version}-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_LINUX_MUSL_ARM}"
              end
              on_intel do
                url "https://github.com/Skyxim/agent-switch/releases/download/v#{version}/ags-#{version}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_LINUX_MUSL_INTEL}"
              end
            end

            def install
              bin.install "ags"
            end

            test do
              assert_match "ags", shell_output("#{bin}/ags --help")
            end
          end
          EOF

          # Commit and push changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-switch.rb
          if git diff --staged --quiet; then
            echo "Formula is already up to date, skipping commit."
          else
            git commit -m "chore: bump agent-switch to v${VERSION}"
            git push origin main
          fi
